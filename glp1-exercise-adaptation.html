<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e7f7ef" />
  <title>Адаптация упражнений · GLP‑1</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #e7f7ef; }
    iframe { display: block; width: 100%; min-height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="guide" src="glp1-exercise-adaptation-source.html" title="Адаптация упражнений курса GLP‑1"></iframe>
  <script>
    const frame = document.getElementById('guide');
    const theme = `
      :root {
        --ink:#18302a; --ink-soft:#24433a; --ink-card:#fff; --white:#173029;
        --muted:#4e6a61; --pink:#d94f9a; --pink-soft:#8a2861; --violet:#6551b5;
        --mint:#28785e; --mint-soft:#d6f3e6; --coral:#a84435;
        --line:rgba(34,86,69,.18); --shadow:0 22px 58px rgba(34,86,69,.12);
      }
      body { background:#e7f7ef; color:var(--white); }
      body::before { opacity:.08; background-image:linear-gradient(rgba(34,86,69,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(34,86,69,.08) 1px,transparent 1px); }
      .brand { background:transparent; box-shadow:none; }
      .brand img { object-fit:contain; object-position:center top; clip-path:inset(0 0 18% 0); }
      .hero { border-color:rgba(217,79,154,.24); background:linear-gradient(135deg,#f7fff9,#dff5e9); }
      .hero-copy > p { color:#36554b; }
      .eyebrow { color:#28785e; }
      .hero-card { border-color:rgba(40,120,94,.2); background:rgba(255,255,255,.78); }
      .hero-card strong { color:#28785e; }
      .hero-card p, .section-heading p { color:#4e6a61; }
      .safety { border-color:rgba(168,68,53,.22); background:#fff3ef; color:#5d302a; }
      .safety-badge { background:#f1b2a6; color:#40211c; }
      .scenario { border-color:rgba(34,86,69,.18); background:#fff; color:#173029; box-shadow:0 4px 18px rgba(34,86,69,.06); }
      .scenario:hover, .scenario:focus-visible { border-color:#d94f9a; box-shadow:0 12px 28px rgba(217,79,154,.12); }
      .scenario[aria-pressed="true"] { border-color:#28785e; background:#dff4e9; box-shadow:0 0 0 1px rgba(40,120,94,.12),0 14px 30px rgba(40,120,94,.08); }
      .result { border-color:rgba(101,81,181,.24); background:#fff; box-shadow:0 8px 28px rgba(34,86,69,.07); }
      .result.is-empty { background:#f9fffb; color:#4e6a61; }
      .empty-inner strong { color:#28785e; }
      .result h3 { color:#8a2861; }
      .reset { color:#4e6a61; }
      .reset:hover { color:#173029; }
      .adapt-card { border-color:rgba(34,86,69,.14); background:#fff; }
      .adapt-card-copy p { color:#29483e; }
      .adapt-figure { min-width:0; margin:0; }
      .adapt-figure figcaption { padding:8px 2px 2px; color:#36554b; font-size:12px; font-weight:700; line-height:1.3; text-align:center; }
      .footer-note { border-color:rgba(34,86,69,.18); color:#4e6a61; }
    `;
    const copy = {
      knees: {
        title: 'Если вам некомфортно стоять на четвереньках из-за дискомфорта в коленях',
        texts: ['Положите плед под верхнюю треть голени, чтобы уменьшить давление на колено. Само колено не должно лежать на пледе.']
      },
      seat: {
        title: 'Если вам сложно сидеть на седалищных буграх и сохранять изгиб в пояснице',
        texts: [
          'Если вам неудобно сидеть на коленях с тазом на пятках, попробуйте следующие варианты:',
          'Положите свёрнутый плед, подушку или кубик для йоги так, чтобы сесть на седалищные бугры и сохранить естественный изгиб в пояснице.',
          'Если в предыдущих положениях вам некомфортно, выполняйте упражнения сидя на стуле. Сохраняйте естественный изгиб в пояснице и опору на седалищные бугры.'
        ]
      },
      balance: {
        title: 'Если вам сложно удерживать равновесие',
        texts: ['Придерживайтесь за устойчивый стул или стол. Выберите опору удобной для вас высоты.', 'Можно использовать стену как опору.']
      },
      range: {
        title: 'Если вам сложно выполнять упражнение в полной амплитуде',
        texts: ['Если полная амплитуда даётся с трудом, уменьшите её до комфортной, сохраняя технику выполнения упражнения.']
      },
      wrists: {
        title: 'Если вам некомфортно опираться на запястья в положении на четвереньках',
        texts: ['Опуститесь на предплечья.', 'Если удерживать планку на предплечьях сложно, опустите колени на ковёр.']
      }
    };
    function fitFrame(doc) {
      requestAnimationFrame(() => {
        const height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        frame.style.height = `${height}px`;
      });
    }
    function patchScenario(doc, key) {
      const result = doc.getElementById('result');
      if (!result || result.classList.contains('is-empty')) return;
      const item = copy[key];
      if (!item) return;
      const title = result.querySelector('#result-title');
      if (title) title.textContent = item.title;
      let cards = [...result.querySelectorAll('.adapt-card')];
      if (key === 'wrists' && cards.length === 3) {
        const secondMedia = cards[1].querySelector('.adapt-card-media');
        secondMedia.append(cards[2].querySelector('img'));
        secondMedia.style.setProperty('--image-count', '2');
        cards[2].remove();
        cards = [...result.querySelectorAll('.adapt-card')];
      }
      const adaptGrid = result.querySelector('.adapt-grid');
      if (adaptGrid && cards.length === 1) adaptGrid.style.gridTemplateColumns = 'minmax(0, 1fr)';
      cards.forEach((card, index) => {
        const paragraph = card.querySelector('.adapt-card-copy p');
        if (paragraph && item.texts[index]) paragraph.textContent = item.texts[index];
      });
      if (key === 'range') {
        const media = cards[0]?.querySelector('.adapt-card-media');
        const images = [...(media?.querySelectorAll('img') || [])];
        images.forEach((img, index) => {
          const figure = doc.createElement('figure');
          figure.className = 'adapt-figure';
          img.alt = index === 0 ? 'Пример полной амплитуды' : 'Пример комфортной амплитуды';
          img.replaceWith(figure);
          figure.append(img);
          const caption = doc.createElement('figcaption');
          caption.textContent = index === 0 ? 'Пример полной амплитуды' : 'Пример комфортной амплитуды';
          figure.append(caption);
        });
      }
      fitFrame(doc);
    }
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      doc.title = 'Адаптация упражнений · GLP‑1';
      const style = doc.createElement('style');
      style.textContent = theme;
      doc.head.append(style);
      doc.querySelector('.hero-copy > p:not(.eyebrow)')?.replaceChildren('Выберите ситуацию, которая вам подходит, и посмотрите варианты адаптации упражнения.');
      doc.querySelector('.hero-card strong').textContent = 'Тренировка может подстраиваться под вас';
      doc.querySelector('.hero-card p').textContent = 'Опора, положение и амплитуда могут меняться. Сохраняйте внимание к технике и своему самочувствию.';
      doc.querySelector('.safety p').textContent = 'Если состояние ухудшается, появляются выраженная слабость, головокружение, предобморочное состояние, сильная или нарастающая боль, многократная рвота либо признаки обезвоживания, остановите тренировку и обратитесь за медицинской помощью.';
      doc.getElementById('choose-title').textContent = 'Что сейчас вызывает затруднение?';
      doc.querySelector('.section-heading > p').textContent = 'Выберите одну карточку';
      doc.querySelector('.empty-inner p').textContent = 'Выберите одну из ситуаций выше, чтобы открыть варианты адаптации.';
      doc.querySelector('.footer-note span').textContent = 'Эта памятка помогает адаптировать выполнение упражнений, но не заменяет рекомендации лечащего врача.';
      const result = doc.getElementById('result');
      result.setAttribute('role', 'status');
      result.setAttribute('aria-atomic', 'true');
      doc.querySelectorAll('.scenario').forEach(button => {
        button.addEventListener('click', () => setTimeout(() => patchScenario(doc, button.dataset.scenario), 0));
      });
      doc.addEventListener('click', event => {
        if (event.target.closest('#reset')) setTimeout(() => {
          const empty = doc.querySelector('.empty-inner p');
          if (empty) empty.textContent = 'Выберите одну из ситуаций выше, чтобы открыть варианты адаптации.';
          fitFrame(doc);
        }, 0);
      });
      new MutationObserver(() => fitFrame(doc)).observe(doc.body, {subtree:true,childList:true,attributes:true});
      fitFrame(doc);
    });
  </script>
</body>
</html>
